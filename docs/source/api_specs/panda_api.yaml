        in: query
        required: true
        description: JEDI Task ID
        schema:
          type: integer
      - name: since
        in: query
        required: false
        description: 'read the jobs modified at or after this time from jobsArchived4
          and the archive, in UTC,

          e.g. `2026-10-12 14:30:45` (ISO 8601 is accepted). Defaults to the creation
          of the task'
        schema:
          type: string
      - name: after_panda_id
        in: query
        required: false
        description: return only the jobs with a larger PandaID, for the next page.
          Defaults to from the first
        schema:
          type: integer
      responses:
        '200':
