  /v1/workflow/get_workflow_status:
    get:
      summary: Get workflow status
      description: 'Report the status of a workflow together with the spread of its
        steps across statuses. The step

        relation query answers about the parts of a workflow; this answers about the
        workflow itself,

        which is what a consumer polling after submission needs. Requires a secure
        connection.'
      tags:
      - workflow
      parameters:
      - name: workflow_id
        in: query
        required: true
        description: ID of the workflow to report on
        schema:
          type: integer
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: The workflow's own status and a count of its steps
                      per status. reason says which step failed the workflow, or why
                      it was cancelled, and is null while it is still running. The
                      times are ISO 8601 strings, and start_time and end_time are
                      null until the workflow starts and finishes. A workflow that
                      is not a sub-workflow has a null parent_id. submitted_as records
                      only whether the submitter held a production role; a step carries
                      its own prodSourceLabel.
                    properties:
                      workflow_id:
                        type: integer
                      name:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      submitted_as:
                        type: string
                      user:
                        type: string
                      parent_id:
                        type: integer
                      creation_time:
                        type: string
                      start_time:
                        type: string
                      end_time:
                        type: string
                      n_steps:
                        type: integer
                      step_status_counts:
                        type: object
                required:
                - success
                - message
                - data
