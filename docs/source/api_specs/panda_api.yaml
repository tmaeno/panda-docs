  /v1/workflow/get_workflow_details:
    get:
      summary: Get workflow details
      description: 'Report a workflow whole: its own status, its steps with how they
        relate and how far each has

        got, and the data passing through it. The separate status and relation queries
        each answer part

        of this; a client showing a workflow wants all of it, and one answer spares
        it a round trip per

        task. Requires a secure connection.'
      tags:
      - workflow
      parameters:
      - name: workflow_id
        in: query
        required: true
        description: ID of the workflow to report on
        schema:
          type: integer
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: 'Everything get_workflow_status reports, plus steps
                      and data. Each step carries what get_step_relations reports
                      for it, plus progress: n_files, n_files_finished, n_files_failed
                      and pct_finished over the task''s master input datasets, which
                      is null for a step whose target is not a JEDI task or which
                      has not been submitted. Steps come in member_id order and data
                      in the order it flows through the workflow. {"workflow_id":
                      int, ..., "steps": list, "data": list}'
                required:
                - success
                - message
                - data
