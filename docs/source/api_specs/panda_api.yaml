                    description: 'The jobs of the task, and what tells how complete
                      they are. {"rows": [...], "truncated": bool, "max_rows": int,
                      "after_panda_id": int or None, "counts": {str: int}, "as_of":
                      datetime, "since": datetime or None, "until": datetime, "retained_from":
                      datetime or None, "partitions": int, "probes": int, "budget":
                      int} - rows: one dict per job, ordered by PandaID and starting
