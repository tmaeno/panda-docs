                      currentPriority, computingSite and attemptNr - truncated, max_rows:
                      whether the rows were cut at max_rows, the most a call returns;
                      when cut, the next page starts after the last PandaID of rows
                      - after_panda_id: the one given, or None - counts: the number
                      of jobs by jobStatus, every job in the window counted, whatever
                      page this is and however many rows were cut - as_of: database
                      time in UTC taken before the rows were read - since, until:
                      the window read on jobsArchived4 and the archive, after the
                      widening. since is None when it has no start - retained_from:
                      time from which the archive holds every row, or None when it
                      cannot be told. Old partitions are dropped, so jobs of a task
                      older than this may be missing - partitions, probes, budget:
                      the partitions of the two tables the window touches, each table
                      counted as at least 1, the index lookups of the call, two for
                      each table or partition, and the db_read_probe_budget On failure,
                      with the reason in the message, the reason as values: - None:
                      task_id is not an integer - {"rejected": "invalid_window"}:
                      since is not a time - {"rejected": "probe_budget", "probes":
                      int, "partitions": int, "budget": int}: the lookups exceed the
