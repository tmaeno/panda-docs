    get:
      summary: Get the worker rows of a job
      description: 'Gets the rows Harvester_Workers holds for the harvester workers
        of a job, with every column. The workers are those

        Harvester_Rel_Jobs_Workers relates to the job. Requires a secure connection.


        A row holds the current state of a worker only; no history of its status is
        kept. A job gets a worker when harvester

        reports the job in the pandaid_list of the worker (push mode), or when a pilot
        that passes its harvester_id and

        worker_id gets the job (pull mode). In pull mode getting the job also sets
        the worker to status running with nJobs 1,

        and adds it when harvester has not reported it yet, with its other columns
        null until harvester does. A job that

        harvester later reports no longer in the pandaid_list of a worker loses that
        worker. Old workers are removed by the

        database, outside the server, so an old enough job may have lost its workers.'
