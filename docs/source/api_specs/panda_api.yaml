                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: array
                    description: 'The details of each matching task, at most n_tasks:
                      all JediTaskSpec fields plus jobParamsTemplate, taskParams and
                      the input-file progress.'
