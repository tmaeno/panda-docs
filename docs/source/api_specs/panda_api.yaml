        in: query
        required: false
        description: 'time in the format ``%Y-%m-%d %H:%M:%S``. When omitted, the

          time-window cap is removed and matching tasks are returned regardless of
          age.'
        schema:
          type: string
      - name: filters
        in: query
        required: false
        description: 'JSON-encoded dict of {field: pattern} pairs.

          Plain values (no regex metacharacters) become SQL equality conditions.

          Regex patterns (containing ``|``, ``.``, ``*``, etc.) are matched with

          ``re.search`` after fetching full task details. Unrecognised field names
