  /v1/job/get_status_history:
    get:
      summary: Get status history of jobs
      description: 'Gets the status changes recorded for jobs in jobs_StatusLog, oldest
        first for each job, optionally within a time window. Requires a secure connection.


        Each job is looked up once in every daily partition of jobs_StatusLog the
        window touches, and in every partition without a

        window, so the most jobs one call may name is the db_read_probe_budget of
        the server divided by the number of partitions

        touched. A call naming more is refused, not cut short. Both numbers come back
        with every answer, so a caller can split its

        jobs into calls that fit. A window around the lifetimes of the jobs, e.g.
        from their creationTime, lets one call take many

        more jobs than the ~10 a call without a window takes.


        The window is widened, so that a change is not missed when the clock of the
        server that wrote a time such as creationTime

        and the clock of the database differ by a little: both ends are first moved
        out by 10 minutes, then to whole UTC days,

        since back to the start of its day and until forward to the start of the next
        day. Whole days touch no more daily

        partitions; the 10 minutes add one only when an end lies within 10 minutes
        of midnight.


        POST is accepted too, with the arguments in a JSON body (Content-Type: application/json).
        A GET puts every job ID in the

        URL, and a web server refuses a request line over its limit with an HTTP error
        before the call gets here: Apache''s

        default of 8190 bytes holds about 420 job IDs. A form-encoded POST is refused,
        since only the values of a GET are

        converted from strings.'
      tags:
      - job
      parameters:
      - name: job_ids
        in: query
        required: true
        description: list of PanDA job IDs
        schema:
          type: array
          items:
            type: integer
      - name: since
        in: query
        required: false
        description: read only the changes at or after this time, in UTC, e.g. `2026-10-12
          14:30:45` (ISO 8601 is accepted)
        schema:
          type: string
      - name: until
        in: query
        required: false
        description: read only the changes before this time, in UTC, in the same format
        schema:
          type: string
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: 'The status changes of the jobs, and what tells how
                      complete they are. {"rows": [...], "as_of": datetime, "retained_from":
                      datetime or None, "since": datetime or None, "until": datetime
                      or None, "partitions": int, "budget": int, "record_statuschange":
                      bool} - rows: one dict per status change, with PandaID, modificationTime,
                      jobStatus, prodSourceLabel, cloud, computingSite, modificationHost
                      and modiftime_extended. A job without rows has none - as_of:
                      database time in UTC taken before the rows were read. Every
                      change committed by then is in rows - retained_from: time from
                      which the table holds every row, or None when it cannot be told.
                      Old partitions are dropped, so a job without rows before this
                      time may still have changed its status then - since, until:
                      the window actually read, after the widening, or None for an
                      open end. A job without rows outside the window may still have
                      changed its status there - partitions, budget: the number of
                      partitions the window touches, counted as 1 when there are none,
                      and the db_read_probe_budget; a call with the same window may
                      name at most budget // partitions jobs - record_statuschange:
                      whether this server writes jobs_StatusLog. Other PanDA nodes
                      have their own setting On failure, with the reason in the message,
                      the reason as values: - {"rejected": "no_keys"}: no job_ids
                      - {"rejected": "too_many_keys", "keys": int, "max_keys": int}:
                      more job_ids than one IN list takes - {"rejected": "invalid_window"}:
                      since or until is not a time, or since is not before until -
                      {"rejected": "probe_budget", "keys": int, "partitions": int,
                      "budget": int}: keys x partitions exceed the budget - {"error":
                      str}: the database failed, with the error code (ORA-xxxxx, or
                      the SQLSTATE on Postgres)'
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/job/get_datasets_by_name:
    get:
      summary: Get datasets by name
      description: 'Gets the rows of the PanDA Datasets table (the datasets jobs work
        with, such as the _sub and _dis ones made for

        them, not JEDI_Datasets) for the given names. Requires a secure connection.


        The table keeps one row per dataset, under the form of the name its first
        writer used, scope:name or name. So each

        name is looked up in both forms: a name with a scope also without it, and
        a name without one also with the scope

        its first part gives (up to the first dot, or up to the second for user and
        group datasets), which is the scope

        the vuid of the dataset is made with. Every row says which of the given names
        it answers.


        Each form is a key, looked up once in every partition of the table, which
        is partitioned on modificationdate, so

        the most names one call may give is the db_read_probe_budget of the server
        divided by keys_per_name times the

        number of partitions. A call giving more is refused, not cut short. The three
        numbers come back with every answer,

        so a caller can split its names into calls that fit.


        POST is accepted too, with the arguments in a JSON body (Content-Type: application/json).
        A GET puts every name in

        the URL, and a web server refuses a request line over its limit with an HTTP
        error before the call gets here. A

        form-encoded POST is refused, since only the values of a GET are converted
        from strings.'
      tags:
      - job
      parameters:
      - name: names
        in: query
        required: true
        description: names of the datasets
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: 'The rows of the datasets, and what tells how complete
                      they are. {"rows": [...], "as_of": datetime, "retained_from":
                      datetime or None, "partitions": int, "budget": int, "keys_per_name":
                      int} - rows: one dict per row, ordered by name and creationdate,
                      with every column: vuid, name, version, type, status, numberfiles,
                      currentfiles, creationdate, modificationdate, MoverID, transferStatus
                      and subType, with null for NULL, and asked_as: the given names,
                      in the order given, that the row answers in either form. A name
                      without rows has none - as_of: database time in UTC taken before
                      the rows were read - retained_from: time from which the table
                      holds every row, on modificationdate, or None when it cannot
                      be told. Old partitions are dropped, so a dataset last modified
                      before this time may have been in the table - partitions, budget,
                      keys_per_name: the number of partitions, counted as 1 when there
                      are none, the db_read_probe_budget, and the keys a name is looked
                      up with; a call may give at most budget // (keys_per_name *
                      partitions) names On failure, with the reason in the message,
                      the reason as values: - {"rejected": "no_keys"}: no names -
                      {"rejected": "too_many_keys", "keys": int, "max_keys": int,
                      "keys_per_name": int}: more keys than one IN list takes - {"rejected":
                      "probe_budget", "keys": int, "partitions": int, "budget": int,
                      "keys_per_name": int}: keys x partitions exceed the budget -
                      {"error": str}: the database failed, with the error code (ORA-xxxxx,
                      or the SQLSTATE on Postgres) keys counts the forms looked up,
                      and a form shared by two names, such as s:n given with n, counts
                      once.'
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
