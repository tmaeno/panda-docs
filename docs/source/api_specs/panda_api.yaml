                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: 'The workers of the job. {"rows": [...], "truncated":
                      bool, "max_rows": int, "as_of": datetime} - rows: one dict per
                      worker, ordered by harvesterID and workerID, with every column
                      of Harvester_Workers and None for NULL. The keys are the names
                      of WorkerSpec (harvesterID, workerID, status, submitTime, startTime,
                      endTime, lastUpdate, diagMessage, errorCode, nativeStatus, nativeExitCode,
                      ...), plus pilotStartTime, pilotEndTime, pilotStatus and pilotStatusSyncTime,
                      which the pilot sets. startTime is when the worker got its CPUs
                      and pilotStartTime when the pilot on it started. A job without
                      workers, or not found, has none - truncated, max_rows: whether
                      the rows were cut at max_rows, the most a call returns - as_of:
                      database time in UTC taken before the rows were read On failure,
                      with the reason in the message: {"error": str} when the database
                      failed, with the error code (ORA-xxxxx, or the SQLSTATE on Postgres).'
