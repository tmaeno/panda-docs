  /v1/task/retry:
    post:
      summary: Task retry
      description: 'Retry a given task e.g. in exhausted state. Requires a secure
        connection without a production role to retry own tasks and with a production
        role to retry others'' tasks.


        An analysis task that is still running, scouting or pending is not retried
        as a whole. Instead, its failed jobs

        are retried: only the input files that have used up their attempts (attemptNr
        reached maxAttempt, or failedAttempt

        reached maxFailure) get 3 more attempts and are reactivated. Input files that
        still have attempts left are not

        changed, so repeating the retry does not keep raising their limits.'
      tags:
      - task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: integer
                  description: JEDI Task ID
                new_parameters:
                  type: object
                  description: 'a dictionary with the new parameters for rerunning
                    the task. The new parameters are merged with the existing ones.

                    The parameters are the attributes in the JediTaskSpec object (https://github.com/PanDAWMS/panda-jedi/blob/master/pandajedi/jedicore/JediTaskSpec.py).'
                no_child_retry:
                  type: boolean
                  description: if True, the child tasks are not retried. Defaults
                    to False
                discard_events:
                  type: boolean
                  description: if True, events will be discarded. Defaults to False
                disable_staging_mode:
                  type: boolean
                  description: if True, the task skips staging state and directly
                    goes to subsequent state. Defaults to False
                keep_gshare_priority:
                  type: boolean
                  description: if True, the task keeps current gshare and priority.
                    Defaults to False
                ignore_hard_exhausted:
                  type: boolean
                  description: if True, the task ignores the limits for hard exhausted
                    state and can be retried even if it is very faulty. Defaults to
                    False
              required:
              - task_id
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: integer
                    description: The return code, 0 when the retry was registered,
                      otherwise the reason it was not, explained in the message field.
                      success is always true, so check this code. For an analysis
                      task that is still running, scouting or pending, the failed
                      jobs are retried instead and the code is 0, or 3 when new_parameters
                      were given.
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
