                  type: number
                  description: Clock speed in MHz. Optional, defaults to `None`.
                total_memory:
                  type: integer
                  description: Total memory in MB. Optional, defaults to `None`.
                total_local_disk:
                  type: integer
                  description: Total disk space in GB. Optional, defaults to `None`.
                timeout:
                  type: integer
                  description: The timeout value. Defaults to 60.
