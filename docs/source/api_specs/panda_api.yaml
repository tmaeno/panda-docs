                  type: string
                  description: CPU model, e.g. `AMD EPYC 7351`.
                panda_queue:
                  type: string
                  description: PanDA queue the worker node is associated to. Optional,
                    defaults to `None`.
                n_logical_cpus:
                  type: integer
                  description: 'Number of logical CPUs: n_sockets * cores_per_socket
                    * threads_per_core.

                    When SMT is enabled, this is the number of threads. Otherwise
                    it is the number of cores. Optional, defaults to `None`.'
                n_sockets:
                  type: integer
                  description: Number of sockets. Optional, defaults to `None`.
                cores_per_socket:
                  type: integer
                  description: Number of cores per socket. Optional, defaults to `None`.
                threads_per_core:
                  type: integer
                  description: Number of threads per core. When SMT is disabled, this
                    is 1. Otherwise a number > 1. Optional, defaults to `None`.
