        tasks are

        returned regardless of age. This is useful for by-ID / by-reqID lookups (e.g.

        ``filters={"jediTaskID": <id>}`` or ``{"reqID": <id>}``) of tasks of any age.
        Because the

        request always adds ``userName`` to the criteria, the criteria is never empty,
        so omitting

        ``since`` is safe.


        Filters are split server-side: plain-value patterns (no regex metacharacters)
        become SQL

        equality conditions pushed to the DB; patterns with metacharacters are applied
        in Python via

        ``re.search`` on the full task dict returned by ``get_task_details_json``.'
