                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: 'The commands for the task, and what tells how complete
                      they are. {"rows": [...], "as_of": datetime, "retained_from":
                      datetime or None} - rows: one dict per command, with - command_id:
                      ID of the request. A request acting on several tasks has one
                      row per task with the same ID - jediTaskID, command (the endpoint,
                      e.g. retry), parameters (dict of the other arguments; one over
                      64 KiB of JSON is {"omitted_bytes": size}) - requester (user
                      name), prod_role (bool), client_addr (host name or IP address
                      of the client, or of a proxy in between), server_host (the server
                      that received it) - command_time: when it was received, in UTC
                      - status: where the command is, one of - received: the server
                      has not responded yet, or stopped before it did - responded:
                      the server responded and nothing further follows; whether the
                      command was done or refused is in response, which each endpoint
                      shapes in its own way - error: the server raised an exception
                      instead of responding - queued: registered for JEDI, which has
                      not taken it yet - accepted / rejected: JEDI took the command,
                      or rejected it - superseded: a later command for the task replaced
                      it before JEDI took it - status_time: when status last changed,
                      in UTC - status_reason: why status moved on from queued, e.g.
                      "running -> toretry", "task in done" or "superseded by kill"
                      - response: {"success", "message", "data"} returned to the client,
                      with message and data shortened, or {"exception": str}; None
                      while received - response_time: when the server responded, in
                      UTC A task without rows got no command through these endpoints
                      - as_of: database time in UTC taken before the rows were read.
                      Every command received by then is in rows - retained_from: time
                      from which the table holds every row, or None when it cannot
                      be told. Old partitions are dropped, so a task without rows
                      before this time may still have got commands then On failure,
                      with the reason in the message: {"error": str} when the database
                      failed, with the error code (ORA-xxxxx, or the SQLSTATE on Postgres),
                      and None otherwise.'
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
