openapi: 3.0.3
servers:
- url: https://pandaserver.cern.ch/api
- url: http://pandaserver.cern.ch/api
info:
  title: PanDA API
  version: 1.0.0
  description: "\n### Protocol: we generally require communication over HTTPS. The\
    \ server will not accept HTTP requests unless explicitly mentioned.\n\n### HTTP\
    \ methods:\n* GET: Retrieve data from the server. Parameters have to be sent **in\
    \ the URL**. List parameters are passed by repeating the parameter name (e.g.\
    \ `?job_ids=1&job_ids=2`).\n```bash\nexport pandaurl=https://pandaserver.cern.ch:25443\n\
    \  curl --capath \"${X509_CERT_DIR}\"     --cert \"${X509_USER_PROXY}\"     --key\
    \ \"${X509_USER_PROXY}\"     \"${pandaurl}/api/v1/task/get_status?task_id=12345\"\
    \n```\n```python\nimport os\nimport requests\n\npandaurl = \"https://pandaserver.cern.ch:25443\"\
    \nproxy = os.environ[\"X509_USER_PROXY\"]\nresponse = requests.get(\n    f\"{pandaurl}/api/v1/task/get_status\"\
    ,\n    params={\"task_id\": 12345},\n    cert=(proxy, proxy),\n    verify=os.environ[\"\
    X509_CERT_DIR\"],\n)\n```\n* PUT: Update data on the server. Parameters have to\
    \ be sent **in the body** in json encoded format. When the client wants to gzip\
    \ the data, the content encoding has to be set accordingly.\n```bash\nexport pandaurl=https://pandaserver.cern.ch:25443\n\
    curl --capath \"${X509_CERT_DIR}\"   --cert \"${X509_USER_PROXY}\"   --key \"\
    ${X509_USER_PROXY}\"   --json '{\"task_id\": 12345}'   \"${pandaurl}/api/v1/file_server/upload_file_recovery_request\"\
    \n```\n```python\nimport os\nimport requests\n\npandaurl = \"https://pandaserver.cern.ch:25443\"\
    \nproxy = os.environ[\"X509_USER_PROXY\"]\nresponse = requests.post(\n    f\"\
    {pandaurl}/api/v1/file_server/upload_file_recovery_request\",\n    json={\"task_id\"\
    : 12345},\n    cert=(proxy, proxy),\n    verify=os.environ[\"X509_CERT_DIR\"],\n\
    )\n```\n\n### Response formats: \nThe return codes are usually specified with\
    \ each API function, but in general:\n* 200: Function called correctly and response\
    \ will be `Content-type: application/json`. This does not necessarily mean that\
    \ the operation was successful, but that the function was called correctly.  \
    \   Reasons why the operation could fail are:\n    * Wrong parameters or the JSON\
    \ could not be decoded.\n    * The function was called using the wrong HTTP method\
    \ (e.g. GET instead of PUT).  \n    * The function expects authentication (certificate/token)\
    \ and it was not provided.\n    * The function expects production role and it\
    \ was not provided.\n    * Caught exceptions when interacting with the database.\n\
    \    \nThe usual response dictionary has the following format:\n```\n{ \"success\"\
    : True/False, \"message\": \"Usually an error when there was a failure. The message\
    \ can generally be ignored if the operation was successful.\", \"data\": \"The\
    \ data returned if the operation was successful.\" }\n```\n* 403: Forbidden. The\
    \ client called a forbidden function or there was an authentication issue. The\
    \ response will use `Content-type: text/plain`.\n* 500: Server crashed calling\
    \ the method. The response will use `Content-type: text/plain`.\n* 503: The server\
    \ is overloaded. The call did not reach PanDA and the response comes from directly\
    \ `httpd`. \n"
paths:
  /v1/async_process/submit_grep_request:
    post:
      summary: Submit a grep request
      description: 'Submit a grep request to be processed asynchronously on the target
        service or machine. A line matches either a

        regular expression or any of a list of fixed strings.'
      tags:
      - async_process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                log_filename:
                  type: string
                  description: 'filename (not full path) of the log file under panda_config.logdir.
                    A .gz is refused

                    while the file it is compressed from is still there, as logrotate
                    removes that file only once the .gz

                    is complete: the machine''s result is then failed with an error_msg
                    ending in "Being compressed", and

                    the .gz may be asked about again later, as compressing a large
                    log takes tens of minutes'
                pattern:
                  type: string
                  description: 'regular expression to search for, in the syntax of
                    rg whether the file is compressed or not;

                    mutually exclusive with fixed_strings'
                fixed_strings:
                  type: array
                  description: 'strings to search for as they are, a line matching
                    when it holds any of them

                    (1..1000 strings, each 1..1000 characters and without a line break);
                    mutually exclusive with pattern'
                  items:
                    type: string
                service_name:
                  type: string
                  description: target service (e.g. "server", "jedi"); mutually exclusive
                    with machine_name
                machine_name:
                  type: string
                  description: target specific machine hostname; mutually exclusive
                    with service_name
                max_matches:
                  type: integer
                  description: 'stop after this many matching lines (1..200000). Defaults
                    to a

                    bound that leaves the stored result unchanged; results that hit
                    the cap come

                    back with truncated set, so an incomplete answer is never read
                    as an absent one'
                tail_bytes:
                  type: integer
                  description: 'search only the last this many bytes of the file (1..3221225472),

                    which is how to ask about recent activity in a multi-gigabyte
                    log. The search starts

                    with the first whole line there. Ignored for .gz files, where
                    an arbitrary offset is

                    not a valid stream. Cold disks read 7 to 33 MB/s, so on a slow
                    day the widest window

                    does not finish in the 240 s a grep may run; since and until read
                    fewer bytes'
                whole_records:
                  type: boolean
                  description: "give each matching line with the rest of its log record:\
                    \ the lines after it that do not\nstart with a time stamp (YYYY-MM-DD\
                    \ HH:MM:SS), such as those of a traceback, up to the next line\
                    \ that\ndoes. A record comes with at most 200 lines after its\
                    \ matching line. The result of each machine is then\nJSON instead\
                    \ of the lines: {\"records\": [...], \"window\": {...} or null}\n\
                    - records: in the order of the file, each {\"offset\": int, \"\
                    head\": bool, \"lines\": [str, ...], \"cut\": bool}.\n  offset\
                    \ is the byte offset in the file, decompressed for a .gz, where\
                    \ the first line given starts, the\n  same in any request until\
                    \ the file is rotated. head is false when that line matched within\
                    \ the lines\n  of a record whose first line did not match, and\
                    \ so is not the start of its record. cut is true when\n  the record\
                    \ has more lines than were given, which sets truncated too. lines\
                    \ come without line breaks\n- window: for tail_bytes, since or\
                    \ until, the bytes searched:\n  {\"offset\": int, \"first_stamp\"\
                    : str or None, \"end\": int or None, \"end_stamp\": str or None,\
                    \ \"cut\": bool}.\n  offset is where the search started, and first_stamp\
                    \ the time stamp of the first line from there that\n  starts with\
                    \ one. end is where it stopped, the start of a record that was\
                    \ not searched, and end_stamp\n  the time stamp of that record;\
                    \ both are null when the search ran to the end of the file as\
                    \ it was when\n  read, as it always does for tail_bytes. Every\
                    \ record starting at or after offset and before end was\n  searched\
                    \ whole. cut is true when a time window was cut at 1 GiB, so that\
                    \ it covers less than was asked:\n  ask again with since set to\
                    \ end_stamp. A cut window does not set truncated, which keeps\
                    \ meaning that\n  the result over the bytes searched is not whole,\
                    \ as it calls for asking differently rather than further.\n  null\
                    \ without tail_bytes, since or until, or from a machine whose\
                    \ processor predates them\nDefaults to False, the matching lines\
                    \ alone as they are in the file"
                since:
                  type: string
                  description: 'search only the bytes of the file that hold the records
                    at or after this time, in UTC, e.g.

                    `2026-11-02 13:02:12` (ISO 8601 is accepted, and a time with a
                    UTC offset is converted). The time stamps

                    of the logs are in UTC. The file is bisected on its time stamps,
                    so a narrow window of a log of many

                    gigabytes reads a few megabytes. The bytes searched start at a
                    record stamped at least 60 s before

                    since, for records written out of order. That covers the order
                    within the file only: a difference

                    between the clock the time comes from and the machine''s clock
                    is for the caller to widen the window

                    by. Only for a plain file, together with whole_records, and not
                    with tail_bytes. Without until, the

                    search runs to the end of the file. A window of more than 1 GiB
                    is cut, as window tells'
                until:
                  type: string
                  description: 'search only the bytes that hold the records before
                    this time, in the same format; they end at a

                    record stamped at least 60 s after until. Without since, the search
                    starts at the beginning of the file.

                    When both are given, since must be before until'
              required:
              - log_filename
              - pattern
              - fixed_strings
              - service_name
              - machine_name
              - max_matches
              - tail_bytes
              - whole_records
              - since
              - until
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: The ID to poll /v1/async_process/get_result with.
                      request_id repeats async_id under the name this field had before
                      the rename, for callers that have not moved yet; it goes away
                      once they have, so read async_id.
                    properties:
                      async_id:
                        type: string
                      request_id:
                        type: string
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/async_process/submit_log_list_request:
    post:
      summary: Submit a log list request
      description: 'Submit a request to list the log files under panda_config.logdir
        on the target service or machine: every file whose

        name starts with "panda-", the rotated ones too, so that a caller can choose
        the files to grep by their names and

        times rather than guess how the logs are rotated.


        The result of each machine in /v1/async_process/get_result is a JSON list
        of its files, in the order of their

        names, `[{"name": str, "size": int, "mtime": "YYYY-MM-DD HH:MM:SS"}, ...]`
        with mtime in UTC. It comes back

        truncated when the list does not fit in 1 MB, which a machine keeping its
        logs for months reaches; log_names

        limits the list to the logs asked about. A .gz still being compressed, which
        a grep refuses, is left out, while

        the file it is compressed from is listed.'
      tags:
      - async_process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_name:
                  type: string
                  description: target service (e.g. "server", "jedi"); mutually exclusive
                    with machine_name
                machine_name:
                  type: string
                  description: target specific machine hostname; mutually exclusive
                    with service_name
                log_names:
                  type: array
                  description: 'list only these logs and the files rotated from them:
                    a file whose name is one of

                    them, or is one of them followed by "-", so that panda-a.log takes
                    in panda-a.log-20261012.gz but not

                    panda-ab.log (1..100 names, each 1..255 characters starting with
                    "panda-" and without "/"). A name with

                    no file is left out of the list. Defaults to every file'
                  items:
                    type: string
              required:
              - service_name
              - machine_name
              - log_names
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: The ID to poll /v1/async_process/get_result with.
                      request_id repeats async_id, as for the other requests; read
                      async_id.
                    properties:
                      async_id:
                        type: string
                      request_id:
                        type: string
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/async_process/submit_db_read_request:
    post:
      summary: Submit a read of the database
      description: 'Submit a batch of queries reading tables of the database, to be
        run asynchronously by one machine of the server, on its

        read-only account and in one read-only transaction. The queries are structured,
        not SQL: each reads one or more tables

        of an allowlist with conditions on their columns, and an `in` may take its
        values from the answer to an earlier query

        of the batch. Only the number and the size of the queries are checked here.
        The queries themselves are checked when

        they run, each on its own, so a query refused or failed comes back with its
        reason while the others are answered.

        A query must look up an index, and its index lookups, keys x partitions touched,
        must be within the server''s

        db_read_probe_budget, and those of the whole batch within three times it.
        The form of a query is described in pandaserver/asyncprocess/db_read/request_shape.py
        and the

        form of the answers in pandaserver/asyncprocess/db_read_handlers.py. Requires
        a secure connection and a DN in the

        allowAsyncRequest list.'
      tags:
      - async_process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                queries:
                  type: array
                  description: 'the queries, at most 10, e.g.

                    `[{"tables": ["jobsActive4", "jobsArchived4"], "where": [["jediTaskID",
                    "=", 123]], "columns": ["PandaID", "jobStatus"]}]`'
                  items:
                    type: object
              required:
              - queries
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: 'The ID to poll /v1/async_process/get_result with.
                      Once done, get_result returns `{"success", "message", "data":
                      {"as_of", "answers"}}` with one answer per query, whose status
                      is done, rejected, deadline or error. Only the submitter may
                      read it. {"async_id": str}'
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/async_process/submit_sleep_echo_request:
    post:
      summary: Submit sleep+echo request
      description: 'Submit a sleep+echo request, run on any one machine in the target
        service.

        Results are readable by the requester or any production-role caller (access="production").'
      tags:
      - async_process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_name:
                  type: string
                  description: target service; the job runs on exactly one of its
                    alive machines
                message:
                  type: string
                  description: text echoed back as the result
                seconds:
                  type: integer
                  description: seconds to sleep before echoing (0..60)
              required:
              - service_name
              - message
              - seconds
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: The ID to poll /v1/async_process/get_result with.
                      request_id repeats async_id under the name this field had before
                      the rename, for callers that have not moved yet; it goes away
                      once they have, so read async_id.
                    properties:
                      async_id:
                        type: string
                      request_id:
                        type: string
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/async_process/get_result:
    get:
      summary: Get async request result
      description: "Poll for the results of an async request, of any type and from\
        \ any submitting module.\n\nThe response has two shapes, depending on what\
        \ the request's handler stores.\n\nHandlers writing raw output (grep, log_list,\
        \ sleep_echo) report one entry per machine:\n\n```\n{\n    \"success\": bool,\
        \        # whether this poll succeeded\n    \"message\": str,\n    \"data\"\
        : {\n        \"overall_status\": \"complete\" | \"pending\",\n        \"expected_machines\"\
        : [str, ...],\n        \"results\": [{\"machine_name\": str, \"status\": str,\
        \ \"result\": str,\n                      \"truncated\": int, \"error_msg\"\
        : str, \"attempts\": int,\n                      \"started_at\": str, \"finished_at\"\
        : str,\n                      \"stderr\": str, \"return_code\": int}, ...]\n\
        \    }\n}\n```\n\noverall_status is \"complete\" when all expected machines\
        \ have a terminal result (done/failed).\n\nHandlers writing a structured payload\
        \ (e.g. the Data Carousel operations submitted by\npandaserver.api.v1.data_carousel_api)\
        \ report that payload at the top level instead:\n\n```\n{\n    \"success\"\
        : bool,        # whether the OPERATION succeeded\n    \"message\": str,  \
        \       # the operation's message\n    \"data\": <the operation's data>,\n\
        \    \"async_meta\": {\"status\": \"pending\" | \"running\" | \"done\" | \"\
        failed\",\n                   \"attempts\": int, \"started_at\": str, \"finished_at\"\
        : str,\n                   \"error_msg\": str}\n}\n```\n\nPoll on async_meta.status,\
        \ not on success: success is False while the request is still\n    pending\
        \ or running, and False again when the handler crashed (status \"failed\"\
        , reason in\n    async_meta.error_msg), so it only tells the operation's outcome\
        \ once status is \"done\".\n    async_meta is present whenever the poll itself\
        \ succeeded, so a response without it is a\n    failure of this call (not\
        \ found, not authorized) rather than a report about the request."
      tags:
      - async_process
      parameters:
      - name: async_id
        in: query
        required: true
        description: UUID returned by a submit_* endpoint
        schema:
          type: string
      - name: request_id
        in: query
        required: true
        description: 'the name async_id had before the rename, still accepted so callers

          that have not moved keep working; ignored when async_id is given'
        schema:
          type: string
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: 'Depends on the request''s handler, see the two shapes
                      above. For handlers writing raw output (grep, log_list, sleep_echo),
                      the overall_status ("complete" or "pending"), the expected_machines
                      and one result per machine. For handlers writing a structured
                      payload (e.g. Data Carousel operations), the operation''s own
                      data, with success and message also the operation''s own and
                      an extra top-level async_meta field carrying the request''s
                      status ("pending", "running", "done" or "failed"). On failure:
                      not set when the poll itself fails (async_id not found, not
                      authorized); the message field contains the reason.'
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/creds/set_user_secrets:
    post:
      summary: Set user secrets
      description: Set a key-value pair to store in PanDA. Requires a secure connection.
      tags:
      - credential_management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Key to reference the secret
                value:
                  type: string
                  description: Value of the secret
              required:
              - key
              - value
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    description: Not used. The message field contains the outcome,
                      "OK" when the secret was stored.
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/creds/get_user_secrets:
    post:
      summary: Get user secrets
      description: Get the secrets for a user identified by a list of keys. Requires
        a secure connection.
      tags:
      - credential_management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keys:
                  type: array
                  description: List of keys to reference the secrets to retrieve
                  items:
                    type: string
              required: []
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: string
                    description: 'The user''s secrets as a JSON-encoded dictionary
                      of key to value, limited to the requested keys when keys is
                      given, and an empty dictionary when there are none. On failure:
                      an empty dictionary.'
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
