        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/task/get_job_rows:
    get:
      summary: Get the job rows of a task
      description: 'Gets the rows of the jobs of a task from jobsDefined4, jobsActive4,
        jobsArchived4 and the archive, with their number by

        status. Requires a secure connection.


        jobsArchived4 and the archive are partitioned by day and by a few days on
        modificationTime, and the task is looked up

        once in each of their partitions a window touches. The window starts at since,
        or at the creation of the task without

        since, and ends at the database time. Both ends are moved out by 10 minutes
        for the clocks of the servers and then to

        whole UTC days. A task that is not found and is given no since is read without
        a start, in every partition. A call

        that would look up more partitions than the db_read_probe_budget of the server
        allows is refused, not cut short; a

        later since lets it fit.


        The rows of all four tables are read by one statement, so a job moving between
        tables meanwhile is read once, and a

        row the same in two tables is given once. The counts are read by a second
        statement, so a job that changes its status

        in between may be counted under its new status.


        A task with more jobs than one call returns is read in pages: ask the next
        page with after_panda_id set to the last

        PandaID of the page before, with the same since, until a page is not truncated.
        The pages are ordered over all four

        tables, so a job moving between tables from one page to the next is still
        read once.'
