  /v1/pilot/acquire_jobs:
    post:
      summary: Acquire jobs
      description: Acquire jobs for the pilot. The jobs are reserved, the job status
        is updated and the jobs are returned. Requires a secure connection.
      tags:
      - pilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_name:
                  type: string
                  description: The PanDA queue name
                timeout:
                  type: integer
                  description: Request timeout in seconds. Optional and defaults to
                    60.
                memory:
                  type: integer
                  description: Memory limit for the job. Optional and defaults to
                    `None`.
                disk_space:
                  type: integer
                  description: Disk space limit for the job. Optional and defaults
                    to `None`.
                prod_source_label:
                  type: string
                  description: Prodsourcelabel, e.g. `user`, `managed`, `unified`...
                    Optional and defaults to `None`.
                node:
                  type: string
                  description: Identifier of the worker node/slot. Optional and defaults
                    to `None`.
                computing_element:
                  type: string
                  description: Computing element. Optional and defaults to `None`.
                prod_user_id:
                  type: string
                  description: User ID of the job. Optional and defaults to `None`.
                get_proxy_key:
                  type: boolean
                  description: Flag to request a proxy key.Optional and defaults to
                    `None`.
                task_id:
                  type: integer
                  description: JEDI task ID of the job. Optional and defaults to `None`.
                n_jobs:
                  type: integer
                  description: Number of jobs for bulk requests. Optional and defaults
                    to `None`.
                background:
                  type: boolean
                  description: Background flag. Optional and defaults to `None`.
                resource_type:
                  type: string
                  description: Resource type of the job, e.g. `SCORE`, `MCORE`,....
                    Optional and defaults to `None`.
                harvester_id:
                  type: string
                  description: Harvester ID, used to update the worker entry in the
                    DB. Optional and defaults to `None`.
                worker_id:
                  type: integer
                  description: Worker ID, used to update the worker entry in the DB.
                    Optional and defaults to `None`.
                scheduler_id:
                  type: string
                  description: Scheduler, e.g. harvester ID. Optional and defaults
                    to `None`.
                job_type:
                  type: string
                  description: 'Job type, e.g. `user`, `unified`, ... This is necessary
                    on top of the `prodsourcelabel`

                    to disambiguate the cases of test jobs that can be production
                    or analysis. Optional and defaults to `None`.'
                via_topic:
                  type: boolean
                  description: Topic for message broker. Optional and defaults to
                    `None`.
                remaining_time:
                  type: integer
                  description: Remaining walltime. Optional and defaults to `None`.
                target_architecture:
                  type: object
                  description: 'Hardware of the worker node, either as a dictionary
                    or as a JSON-encoded string.

                    Only jobs of tasks whose hardware requirements are satisfied by
                    the worker node are returned.

                    The `gpus` key contains the list of GPUs, using the same key names
                    as `update_worker_node_gpu`, e.g.

                    ``{"gpus": [{"vendor": "NVIDIA", "model": "NVIDIA A100-SXM4-40GB",
                    "vram": 40960,

                    "architecture": "Ampere", "framework_version": "12.4", "driver_version":
                    "575.57.08"}]}``.

                    An empty `gpus` list means that the worker node has no GPU, while
                    an absent `gpus` key means that

                    the worker node doesn''t report GPU information, in which case
                    GPU requirements are not checked.

                    Optional and defaults to `None`.'
                container_name:
                  type: string
                  description: 'The container image the worker is bound to, for a
                    worker already running inside its

                    image and unable to start another one. Only jobs whose `container_name`
                    equals it are returned,

                    so such a worker never acquires a job it cannot run. A worker
                    that can run any image omits it.

                    Optional and defaults to `None`.'
              required:
              - site_name
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: 'The acquired jobs, in jobs, one job dictionary each.
                      A job dictionary holds the job description for the pilot, StatusCode
                      0, nSent, and, when they apply, the user''s secrets in secrets,
                      the pilot secrets in pilotSecrets, and the proxy key in credname
                      and myproxy. When n_jobs is explicitly null, data is the job
                      dictionary of the single acquired job instead. On failure: null,
                      with the reason in the message field (e.g. "No jobs in PanDA").'
                    properties:
                      StatusCode:
                        type: integer
                      jobs:
                        type: array
                        items:
                          type: object
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
