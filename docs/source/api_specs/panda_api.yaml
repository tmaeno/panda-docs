  /v1/workflow/get_step_relations:
    get:
      summary: Get workflow step relations
      description: 'Report which step of a workflow feeds which. The workflow engine
        is data-driven: a step starts because its inputs are ready, not because a

        parent step finished, so it holds no step-to-step edge of its own. This derives
        them from what

        it does hold, and answers for a running workflow as readily as for a finished
        one. Requires a

        secure connection.'
      tags:
      - workflow
      parameters:
      - name: workflow_id
        in: query
        required: true
        description: ID of the workflow to report on
        schema:
          type: integer
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: The workflow's steps, one entry per step in member_id
                      order, each with step_id, member_id, name, type, flavor, prod_source_label,
                      status, reason, target_id and parent_step_ids. reason is set
                      only for a step that failed or was cancelled, and prod_source_label
                      only for a step whose target is a PanDA task. A step taking
                      only data produced outside the workflow has no parent, and a
                      step that has not started yet has no target_id.
                    properties:
                      workflow_id:
                        type: integer
                      steps:
                        type: array
                        items:
                          type: object
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
  /v1/workflow/get_task_relations:
    get:
      summary: Get workflow task relations
      description: 'Report which JEDI task of a workflow feeds which. The task-level
        view of get_step_relations, for consumers that model a chain as related tasks.

        A step running something other than a JEDI task is collapsed, so the relation
        passes through it

        rather than leaving a gap, and a step running a nested workflow is replaced
        by the tasks inside

        it. A step not yet submitted is reported with task_id None, so that a task
        whose producer has

        not started is not mistaken for one with no producer. Requires a secure connection.


        Give either workflow_id, for a whole chain, or task_id, to enter at a task
        without knowing

        which workflow it belongs to.'
      tags:
      - workflow
      parameters:
      - name: workflow_id
        in: query
        required: false
        description: ID of the workflow to report on. Give this or task_id
        schema:
          type: integer
      - name: task_id
        in: query
        required: false
        description: JEDI task ID to report the workflow of. Give this or workflow_id
        schema:
          type: integer
      responses:
        '200':
          description: Method called correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Indicates whether the request was successful (True)
                      or not (False)
                  message:
                    type: string
                    description: Message indicating the nature of the failure. Empty
                      or meaningless if the request was successful.
                  data:
                    type: object
                    description: The workflow's tasks, parents first, each entry with
                      key, task_id, workflow_id, step_id, name, flavor, status and
                      parents. Parents are named by key rather than by task ID, since
                      a task not yet submitted has no ID to be named by; every entry
                      carries its own task_id. Entering by task_id adds "asked_for",
                      the key of the task asked about.
                    properties:
                      workflow_id:
                        type: integer
                      tasks:
                        type: array
                        items:
                          type: object
                required:
                - success
                - message
                - data
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
                example: You are calling an undefined method is not allowed for the
                  requested URL
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: string
                example: Resource not found
        '500':
          description: INTERNAL SERVER ERROR
          content:
            text/plain:
              schema:
                type: string
                example: INTERNAL SERVER ERROR. The server encountered an internal
                  error and was unable to complete your request.
